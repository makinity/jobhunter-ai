name: JobHunter AI Scan

on:
  schedule:
    # Default: every 30 minutes. Change this in GitHub repo Settings → Secrets and variables → Actions
    - cron: "*/30 * * * *"
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgbm-dev libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Decode Facebook cookies
        run: |
          mkdir -p cookies
          echo "${{ secrets.FB_COOKIES }}" | base64 -d > cookies/facebook.json

      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e "
            const t=process.env.TELEGRAM_BOT_TOKEN, c=process.env.TELEGRAM_CHAT_ID;
            console.log('Chat ID:',c);
            fetch('https://api.telegram.org/bot'+t+'/getMe').then(r=>r.json()).then(d=>console.log('Bot:',d.ok,d.result?.username));
            fetch('https://api.telegram.org/bot'+t+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:c,text:'🤖 GitHub Actions test - scanner alive!',parse_mode:'HTML'})}).then(r=>r.json()).then(d=>console.log(d.ok?'✅ Sent!':'❌ Fail:',JSON.stringify(d)));
          "

      - name: Run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js --once
